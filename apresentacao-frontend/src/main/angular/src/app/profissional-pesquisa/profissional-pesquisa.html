<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand">Liga Amadora+</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" routerLink="/time/pesquisa">Times</a>
      <a class="nav-link active" routerLink="/profissional/pesquisa">Profissionais</a>
    </div>
  </div>
</nav>
<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold mb-0">Profissionais Esportivos</h2>
    <a class="btn btn-primary" routerLink="/profissional/criacao">+ Cadastrar</a>
  </div>
  <div class="input-group mb-4" style="max-width:400px">
    <input class="form-control" [(ngModel)]="termoBusca" placeholder="Buscar por nome..." (input)="buscar()">
    <span class="input-group-text">🔍</span>
  </div>
  <div class="card">
    <table class="table mb-0">
      <thead>
        <tr><th>Nome</th><th>Tipo</th><th></th></tr>
      </thead>
      <tbody>
        @for (p of lista; track p.id) {
          <tr>
            <td class="fw-semibold">{{ p.nome }}</td>
            <td><span class="badge bg-secondary">{{ p.tipo }}</span></td>
            <td class="text-end">
              <a class="btn btn-sm btn-outline-primary" [routerLink]="['/profissional', p.id, 'perfil']">Ver / Editar</a>
            </td>
          </tr>
        }
        @if (lista.length === 0) {
          <tr><td colspan="3" class="text-center text-muted py-4">Nenhum profissional encontrado.</td></tr>
        }
      </tbody>
    </table>
  </div>
</div>
