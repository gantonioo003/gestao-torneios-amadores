<div style="display:grid;grid-template-columns:1fr 280px;gap:16px;max-width:1100px;margin:20px auto;padding:0 16px">

  <div>
    <div class="bw" style="margin-bottom:14px">
      <span class="bico">🔍</span>
      <input type="text" [(ngModel)]="busca" placeholder="Buscar no feed...">
    </div>

    <div class="tabs">
      <button class="tab" [class.a]="aba==='todos'" (click)="aba='todos'">Todos</button>
      <button class="tab" [class.a]="aba==='torneios'" (click)="aba='torneios'">Torneios</button>
      <button class="tab" [class.a]="aba==='partidas'" (click)="aba='partidas'">Partidas</button>
      <button class="tab" [class.a]="aba==='times'" (click)="aba='times'">Times</button>
    </div>

    <div class="card" style="margin-bottom:14px">
      <div class="fg"><textarea [(ngModel)]="novoPost" rows="2" placeholder="Compartilhe algo com a comunidade..."></textarea></div>
      <div style="display:flex;justify-content:flex-end;gap:6px">
        <button class="btn btn-g btn-sm">📷 Foto</button>
        <button class="btn btn-p btn-sm" (click)="publicar()">Publicar</button>
      </div>
    </div>

    @for (p of feedFiltrado(); track p.id) {
      <div class="card" style="margin-bottom:10px">
        <div class="fhdr">
          <div class="av">{{p.av}}</div>
          <div style="flex:1">
            <div class="fautor">{{p.autor}}</div>
            <div class="ftempo">{{p.tempo}}</div>
          </div>
          <span class="bdg bdg-c">{{p.tipo}}</span>
        </div>
        <div class="ftexto" style="margin:8px 0">{{p.texto}}</div>
        @if (p.img) { <div style="background:var(--verde-light);border-radius:6px;padding:20px;text-align:center;margin-bottom:8px;color:var(--verde-dark);font-size:11px">📸 {{p.img}}</div> }
        <div style="font-size:11px;color:var(--verde);margin-bottom:8px">{{p.tags}}</div>
        <div class="face">
          <button class="fac" (click)="curtir(p)">❤ {{p.curtidas}} Curtir</button>
          <button class="fac">💬 {{p.comentarios}} Comentar</button>
          <button class="fac">↗ Compartilhar</button>
          <button class="fac">↩ Reagir</button>
        </div>
        @if (p.atualizacao) {
          <div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--borda);font-size:11px;color:var(--muted)">
            🔄 {{p.atualizacao}}
          </div>
        }
      </div>
    }
  </div>

  <div>
    <div class="card">
      <div class="ct">Hashtag</div>
      <div class="fg"><input type="text" placeholder="#hashtag..." [(ngModel)]="hashtag"></div>
      <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px">
        @for (h of hashtags; track h) {
          <span class="bdg bdg-a" style="cursor:pointer" (click)="hashtag=h">{{h}}</span>
        }
      </div>
    </div>
  </div>
</div>
