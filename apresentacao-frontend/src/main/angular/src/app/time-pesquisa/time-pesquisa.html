<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand">Liga Amadora+</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link active" routerLink="/time/pesquisa">Times</a>
      <a class="nav-link" routerLink="/profissional/pesquisa">Profissionais</a>
    </div>
  </div>
</nav>
<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold mb-0">Meus Times</h2>
    <a class="btn btn-primary" routerLink="/time/criacao">+ Criar time</a>
  </div>
  @if (recurso.length === 0) {
    <div class="card p-5 text-center text-muted">Você ainda não tem times cadastrados.</div>
  } @else {
    <div class="row g-3">
      @for (time of recurso; track time.id) {
        <div class="col-md-4">
          <div class="card p-4">
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <h5 class="fw-semibold mb-1">{{ time.nome }}</h5>
                <small class="text-muted">ID #{{ time.id }}</small>
              </div>
              <span class="badge-verde">Responsável</span>
            </div>
            <div class="mt-3 d-flex gap-2">
              <a class="btn btn-sm btn-outline-primary" [routerLink]="['/time', time.id, 'detalhes']">Gerenciar</a>
              <button class="btn btn-sm btn-outline-danger" (click)="excluir(time.id)">Excluir</button>
            </div>
          </div>
        </div>
      }
    </div>
  }
</div>
