<div class="app-shell">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" routerLink="/">
        <span class="brand-mark"><i class="bi bi-shield"></i></span>
        <span>Liga Amadora<span class="brand-plus">+</span></span>
      </a>

      <nav class="main-nav" aria-label="Navegacao principal">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          <i class="bi bi-house"></i> Inicio
        </a>
        <a routerLink="/buscar" routerLinkActive="active">
          <i class="bi bi-search"></i> Buscar
        </a>
        <a routerLink="/palpites" routerLinkActive="active">
          <i class="bi bi-lightning-charge"></i> Palpites
        </a>
        <a routerLink="/feed" routerLinkActive="active">
          <i class="bi bi-megaphone"></i> Feed
        </a>
        <a routerLink="/chat" routerLinkActive="active">
          <i class="bi bi-chat-dots"></i> Chat
        </a>
      </nav>

      <div class="top-actions">
        @if (usuario(); as conta) {
          <a
            class="account-chip"
            routerLink="/home-logada"
            routerLinkActive="active"
            [title]="conta.nome"
            [attr.aria-label]="'Abrir minha área: @' + conta.nomeUsuario">
            <span class="account-avatar">{{ conta.nome.slice(0, 1).toUpperCase() }}</span>
            <span class="account-name">&#64;{{ conta.nomeUsuario }}</span>
          </a>
          <button class="icon-action icon-button" title="Sair" aria-label="Sair da conta" (click)="sair()">
            <i class="bi bi-box-arrow-right"></i>
          </button>
        } @else {
          <a class="icon-action" routerLink="/login" title="Entrar">
            <i class="bi bi-person-circle"></i>
          </a>
        }
        @if (usuario()?.podeCriarTorneio) {
          <a class="btn btn-primary btn-sm" routerLink="/torneio/criacao">Criar torneio</a>
        }
      </div>
    </div>
  </header>

  <section class="route-stage">
    <router-outlet></router-outlet>
  </section>
</div>
