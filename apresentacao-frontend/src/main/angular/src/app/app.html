<div class="app-shell">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" routerLink="/">
        <span class="brand-mark"><i class="bi bi-shield"></i></span>
        <span>Liga Amadora<span class="brand-plus">+</span></span>
      </a>

      <nav class="main-nav" aria-label="Navegacao principal">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          <i class="bi bi-house"></i> Inicio
        </a>
        <a routerLink="/torneio/1" routerLinkActive="active">
          <i class="bi bi-trophy"></i> Torneio
        </a>
        <a routerLink="/time/pesquisa" routerLinkActive="active">
          <i class="bi bi-shield-check"></i> Times
        </a>
        <a routerLink="/profissional/pesquisa" routerLinkActive="active">
          <i class="bi bi-person-badge"></i> Jogadores
        </a>
        <a routerLink="/ranking" routerLinkActive="active">
          <i class="bi bi-bar-chart"></i> Ranking
        </a>
        <a routerLink="/feed" routerLinkActive="active">
          <i class="bi bi-megaphone"></i> Feed
        </a>
        <a routerLink="/chat" routerLinkActive="active">
          <i class="bi bi-chat-dots"></i> Chat
        </a>
      </nav>

      <div class="top-actions">
        <a class="icon-action" routerLink="/login" title="Entrar">
          <i class="bi bi-person-circle"></i>
        </a>
        <a class="btn btn-primary btn-sm" routerLink="/torneio/criacao">Criar torneio</a>
      </div>
    </div>
  </header>

  <section class="route-stage">
    <router-outlet></router-outlet>
  </section>
</div>
