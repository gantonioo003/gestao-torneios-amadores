<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand">Liga Amadora+</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link active" routerLink="/time/pesquisa">Times</a>
      <a class="nav-link" routerLink="/profissional/pesquisa">Profissionais</a>
    </div>
  </div>
</nav>

<div class="container py-5" style="max-width: 600px">
  <a class="text-muted text-decoration-none mb-3 d-inline-block" routerLink="/time/pesquisa">← Voltar</a>
  <h2 class="fw-bold mb-4">Novo time</h2>

  <div class="card p-4">
    <div class="mb-3">
      <label class="form-label fw-semibold">Nome do time *</label>
      <input class="form-control" [(ngModel)]="nome" placeholder="Ex.: Unidos do Bairro">
    </div>
    <div class="d-flex gap-2 mt-2">
      <a class="btn btn-secondary" routerLink="/time/pesquisa">Cancelar</a>
      <button class="btn btn-primary ms-auto" (click)="criar()">Criar time</button>
    </div>
  </div>
</div>
