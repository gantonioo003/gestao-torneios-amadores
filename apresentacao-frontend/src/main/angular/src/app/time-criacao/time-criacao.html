<main class="page page-narrow">
  <div class="hero-row">
    <div>
      <div class="eyebrow">Novo perfil de time</div>
      <h1 class="page-title">Novo time</h1>
      <p class="page-subtitle">O time vira uma identidade da plataforma, com elenco, torneios e historico.</p>
    </div>
    <a class="btn btn-outline" routerLink="/buscar"><i class="bi bi-arrow-left"></i> Voltar</a>
  </div>

  <section class="card panel-strong">
    <div class="form-grid">
      <div class="field">
        <label>Nome do time</label>
        <input [(ngModel)]="nome" placeholder="Ex.: Unidos do Bairro">
      </div>
      <app-identity-editor
        kind="time"
        [required]="true"
        [entityName]="nome"
        [(value)]="imagemUrl">
      </app-identity-editor>
      <div class="grid grid-2">
        <a class="btn" routerLink="/buscar">Cancelar</a>
        <button class="btn btn-primary" (click)="criar()">Criar time</button>
      </div>
    </div>
  </section>
</main>
