<main class="page page-narrow">
  <div class="hero-row">
    <div>
      <div class="eyebrow">Cadastro esportivo</div>
      <h1 class="page-title">Novo profissional esportivo</h1>
      <p class="page-subtitle">O perfil pode depois ser vinculado ao elenco de um time e ganhar historico estatistico.</p>
    </div>
    <a class="btn btn-outline" routerLink="/profissional/pesquisa"><i class="bi bi-arrow-left"></i> Voltar</a>
  </div>

  <section class="card panel-strong">
    <div class="form-grid">
      <div class="field">
        <label>Nome completo</label>
        <input [(ngModel)]="nome" placeholder="Ex.: Joao Silva">
      </div>
      <div class="field">
        <label>Tipo</label>
        <select [(ngModel)]="tipoSelecionado">
          <option value="">Selecione o tipo</option>
          <option value="JOGADOR">Jogador</option>
          <option value="TREINADOR">Tecnico / Treinador</option>
          <option value="AUXILIAR_TECNICO">Auxiliar tecnico</option>
          <option value="PREPARADOR_FISICO">Preparador fisico</option>
          <option value="MEDICO">Medico</option>
        </select>
      </div>
      <div class="grid grid-2">
        <a class="btn" routerLink="/profissional/pesquisa">Cancelar</a>
        <button class="btn btn-primary" (click)="cadastrar()">Cadastrar</button>
      </div>
    </div>
  </section>
</main>
