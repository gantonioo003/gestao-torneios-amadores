<main class="page">
  <div class="hero-row">
    <div>
      <div class="eyebrow">Amistosos</div>
      <h1 class="page-title">Desafios entre times</h1>
      <p class="page-subtitle">Times podem propor amistosos, reagendar e registrar resultado sem misturar com torneios oficiais.</p>
    </div>
  </div>

  <div class="grid layout-1-2">
    <section class="card panel-strong">
      <h2 class="section-title">Propor desafio</h2>
      <div class="form-grid">
        <div class="field">
          <label>Desafiado</label>
          <select [(ngModel)]="timeDesafiado">
            @for (time of times; track time) {
              <option>{{ time }}</option>
            }
          </select>
        </div>
        <div class="grid grid-3">
          <div class="field"><label>Data</label><input type="date" [(ngModel)]="data"></div>
          <div class="field"><label>Hora</label><input type="time" [(ngModel)]="hora"></div>
          <div class="field"><label>Local</label><input [(ngModel)]="local"></div>
        </div>
        <div class="field">
          <label>Mensagem</label>
          <textarea [(ngModel)]="mensagem"></textarea>
        </div>
        <button class="btn btn-primary btn-block" (click)="propor()">Propor desafio</button>
      </div>
    </section>

    <section class="card">
      <h2 class="section-title">Historico de amistosos</h2>
      <div class="table-wrap">
        <table class="table">
          <thead><tr><th>Data</th><th>Jogo</th><th>Status</th><th>Acoes</th></tr></thead>
          <tbody>
            @for (jogo of historico; track jogo.jogo) {
              <tr>
                <td>{{ jogo.data }}</td>
                <td><strong>{{ jogo.jogo }}</strong></td>
                <td><span class="status status-green">{{ jogo.status }}</span></td>
                <td>
                  <button class="btn btn-sm btn-outline">Aceitar</button>
                  <button class="btn btn-sm btn-warn">Reagendar</button>
                  <button class="btn btn-sm">Resultado</button>
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    </section>
  </div>
</main>
