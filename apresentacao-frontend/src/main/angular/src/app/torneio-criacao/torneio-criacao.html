<div class="page">
  <button class="voltar" onclick="history.back()">← Voltar</button>
  <div class="g2" style="align-items:start;gap:20px">

    <div class="card">
      <div class="ct">Dados do Torneio</div>
      <div class="fg"><label>Nome do torneio</label><input type="text" [(ngModel)]="nome" placeholder="Copa da Amizade"></div>
      <div class="fg">
        <label>Formato</label>
        <select [(ngModel)]="formato">
          <option value="">Selecionar...</option>
          <option value="grupos-mata">Grupos + Mata-mata</option>
          <option value="mata-mata">Mata-mata</option>
          <option value="pontos">Pontos corridos</option>
        </select>
      </div>
      <div class="fg"><label>Formato de equipe</label><input type="text" [(ngModel)]="equipe" placeholder="11 titulares + 7 reservas"></div>
      <div class="fg">
        <label>Inscrição</label>
        <div style="display:flex;gap:6px;margin-top:2px">
          <button class="btn btn-sm" [class.btn-p]="inscricao==='aberta'" [class.btn-g]="inscricao!=='aberta'" (click)="inscricao='aberta'">Aberta</button>
          <button class="btn btn-sm" [class.btn-p]="inscricao==='fechada'" [class.btn-g]="inscricao!=='fechada'" (click)="inscricao='fechada'">Fechada</button>
        </div>
      </div>
      <div class="fg"><label>Participantes iniciais</label><input type="number" [(ngModel)]="qtdParticipantes" placeholder="8 times"></div>
      <div class="fg"><label>Regras de entrada</label><textarea [(ngModel)]="regras" rows="2" placeholder="Ex.: Idade mínima 18 anos."></textarea></div>
    </div>

    <div class="card">
      <div class="ct">Preparar Conforme Formato Escolhido</div>
      <div class="g3" style="gap:10px;margin-bottom:16px">
        <div class="card" style="text-align:center;cursor:pointer;padding:12px;transition:border-color .15s"
             [style.border-color]="modo==='estrutura'?'var(--verde)':'var(--borda)'"
             (click)="modo='estrutura'">
          <div style="font-size:28px;margin-bottom:6px">📊</div>
          <div style="font-size:11px;font-weight:700">Gerar estrutura</div>
          <div style="font-size:10px;color:var(--muted);margin-top:3px">Cria grupos, fases e chaveamento</div>
        </div>
        <div class="card" style="text-align:center;cursor:pointer;padding:12px;transition:border-color .15s"
             [style.border-color]="modo==='rodadas'?'var(--verde)':'var(--borda)'"
             (click)="modo='rodadas'">
          <div style="font-size:28px;margin-bottom:6px">📅</div>
          <div style="font-size:11px;font-weight:700">Gerar rodadas</div>
          <div style="font-size:10px;color:var(--muted);margin-top:3px">Define ordem das rodadas</div>
        </div>
        <div class="card" style="text-align:center;cursor:pointer;padding:12px;transition:border-color .15s"
             [style.border-color]="modo==='partidas'?'var(--verde)':'var(--borda)'"
             (click)="modo='partidas'">
          <div style="font-size:28px;margin-bottom:6px">⚽</div>
          <div style="font-size:11px;font-weight:700">Gerar partidas</div>
          <div style="font-size:10px;color:var(--muted);margin-top:3px">Gera confrontos de cada rodada</div>
        </div>
      </div>
      <div class="g2" style="gap:8px">
        <button class="btn btn-p" style="flex:1" (click)="criar()">Criar torneio</button>
        <button class="btn btn-o" style="flex:1">Preparar competição</button>
      </div>
    </div>
  </div>
</div>
