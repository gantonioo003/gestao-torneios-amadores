<main class="page page-narrow">
  <section class="card panel-strong" style="padding: 28px">
    <div style="text-align: center; margin-bottom: 22px">
      <div class="brand" style="justify-content: center">
        <span class="brand-mark"><i class="bi bi-shield"></i></span>
        <span>Liga Amadora<span class="brand-plus">+</span></span>
      </div>
      <p class="muted" style="margin: 10px 0 0">Entre para gerenciar times, torneios, chats e estatisticas.</p>
    </div>

    <div class="tabs" style="margin-bottom: 18px">
      <button class="tab" [class.active]="aba === 'entrar'" (click)="aba = 'entrar'">Entrar</button>
      <button class="tab" [class.active]="aba === 'criar'" (click)="aba = 'criar'">Criar conta</button>
    </div>

    @if (aba === 'entrar') {
      <div class="form-grid">
        <div class="field">
          <label>E-mail</label>
          <input type="email" [(ngModel)]="email" placeholder="seu&#64;email.com">
        </div>
        <div class="field">
          <label>Senha</label>
          <input type="password" [(ngModel)]="senha" placeholder="********">
        </div>
        <button class="btn btn-primary btn-block" (click)="entrar()">Entrar</button>
      </div>
    } @else {
      <div class="form-grid">
        <div class="field">
          <label>Nome completo</label>
          <input [(ngModel)]="nome" placeholder="Lucas Lima">
        </div>
        <div class="field">
          <label>E-mail</label>
          <input type="email" [(ngModel)]="email" placeholder="lucas&#64;email.com">
        </div>
        <div class="field">
          <label>Tipo de conta</label>
          <select [(ngModel)]="tipo">
            <option>Jogador</option>
            <option>Organizador</option>
            <option>Responsavel por time</option>
          </select>
        </div>
        <div class="field">
          <label>Senha</label>
          <input type="password" [(ngModel)]="senha" placeholder="********">
        </div>
        <button class="btn btn-primary btn-block" (click)="criar()">Criar conta</button>
      </div>
    }

    <div class="grid grid-2" style="margin-top: 16px">
      <button class="btn"><i class="bi bi-google"></i> Google</button>
      <button class="btn"><i class="bi bi-facebook"></i> Facebook</button>
    </div>

    <div style="text-align: center; margin-top: 16px">
      <a class="small muted" routerLink="/">Voltar para home publica</a>
    </div>
  </section>
</main>
