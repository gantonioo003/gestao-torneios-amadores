spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/torneios?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:12345}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.torneios.infraestrutura.persistencia.jpa.EstrategiaNomesJpa

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}

spring.sql.init.mode=never

app.google.client-id=${GOOGLE_CLIENT_ID:}
