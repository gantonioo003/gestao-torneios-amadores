services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: torneios
      MYSQL_USER: torneios
      MYSQL_PASSWORD: torneios
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - torneios_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  torneios_data:
